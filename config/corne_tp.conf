#
# Corne Settings
#

#
# RGB Underglow (WS2812 LED strip)
#
# To enable: uncomment the lines below AND uncomment `#define HAS_RGB`
# in boards/shields/corne_tp/corne_tp.dtsi
#
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y


#
# OLED Display
#
# To enable: uncomment the line below AND uncomment `#define HAS_OLED`
# in boards/shields/corne_tp/corne_tp.dtsi
#
# CONFIG_ZMK_DISPLAY=y


#
# Pointing Device (Trackpoint / Mouse)
#
# Enables the built-in ZMK pointing device framework.
CONFIG_ZMK_POINTING=y

# Enable mouse setting behavior for runtime TP adjustment
# CONFIG_ZMK_BEHAVIOR_MOUSE_SETTING=y


#
# Configure PS2 Mouse / Trackpoint Driver Settings
#

# Enable additional error mitigations to prevent cursor jumps
# Only recommended if using the GPIO PS2 driver
# CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE_ERROR_MITIGATION=y


#
# System Settings
#

# Save config to flash more frequently
# Default is 60s and this lowers it to 10
# Only use this setting for debugging.
# Prolonged use can lead to flash chip degradation
# CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# Enable experimental BLE settings
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
